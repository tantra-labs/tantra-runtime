[workspace]
resolver = "2"
members = [
  "crates/tantra-runtime",
  "crates/tantra-runtime-actors",
  "crates/tantra-runtime-api",
  "crates/tantra-runtime-api-rest",
  "crates/tantra-runtime-backtest",
  "crates/tantra-runtime-config",
  "crates/tantra-runtime-enhancer",
  "crates/tantra-runtime-jobs",
  "crates/tantra-runtime-persistence",
  "crates/tantra-runtime-strategy",
  "crates/tantra-runtime-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/tantra-labs/tantra-runtime"

[workspace.dependencies]
# Tantra internal crates
tantra-core = { path = "../tantra-core" }
tantra-risk = { path = "../tantra-risk" }
tantra-runtime = { path = "crates/tantra-runtime" }
tantra-ledger = { path = "../tantra-ledger/crates/tantra-ledger" }
tantra-ledger-portfolio = { path = "../tantra-ledger/crates/tantra-ledger-portfolio" }
tantra-ledger-oms = { path = "../tantra-ledger/crates/tantra-ledger-oms" }
tantra-ledger-journal = { path = "../tantra-ledger/crates/tantra-ledger-journal" }
tantra-ledger-performance = { path = "../tantra-ledger/crates/tantra-ledger-performance" }
tantra-runtime-actors = { path = "crates/tantra-runtime-actors" }
tantra-runtime-api = { path = "crates/tantra-runtime-api" }
tantra-runtime-api-rest = { path = "crates/tantra-runtime-api-rest" }
tantra-runtime-backtest = { path = "crates/tantra-runtime-backtest" }
tantra-runtime-config = { path = "crates/tantra-runtime-config" }
tantra-runtime-enhancer = { path = "crates/tantra-runtime-enhancer" }
tantra-runtime-persistence = { path = "crates/tantra-runtime-persistence" }
tantra-runtime-jobs = { path = "crates/tantra-runtime-jobs" }
tantra-runtime-strategy = { path = "crates/tantra-runtime-strategy" }
tantra-runtime-testing = { path = "crates/tantra-runtime-testing" }
tantra-market-store = { path = "../tantra-market/crates/tantra-market-store" }
tantra-market-core = { path = "../tantra-market/crates/tantra-market-core" }
tantra-market-normalizer = { path = "../tantra-market/crates/tantra-market-normalizer" }
tantra-market-indicators = { path = "../tantra-market/crates/tantra-market-indicators" }
tantra-market-signals = { path = "../tantra-market/crates/tantra-market-signals" }
tantra-market-finance = { path = "../tantra-market/crates/tantra-market-finance" }
tantra-exec-core = { path = "../tantra-exec/crates/tantra-exec-core" }
tantra-exec-auth = { path = "../tantra-exec/crates/tantra-exec-auth" }
tantra-exec-router = { path = "../tantra-exec/crates/tantra-exec-router" }
tantra-exec-slicer = { path = "../tantra-exec/crates/tantra-exec-slicer" }
tantra-exec-audit = { path = "../tantra-exec/crates/tantra-exec-audit" }
tantra-exec-zerodha = { path = "../tantra-exec/crates/tantra-exec-zerodha" }
tantra-exec-upstox = { path = "../tantra-exec/crates/tantra-exec-upstox" }
tantra-exec-angelone = { path = "../tantra-exec/crates/tantra-exec-angelone" }
tantra-agent-core = { path = "../tantra-agent/crates/tantra-agent-core" }
tantra-agent = { path = "../tantra-agent/crates/tantra-agent" }
tantra-agent-chat = { path = "../tantra-agent/crates/tantra-agent-chat" }
tantra-agent-chat-tools = { path = "../tantra-agent/crates/tantra-agent-chat-tools" }
tantra-agent-prompt = { path = "../tantra-agent/crates/tantra-agent-prompt" }
tantra-agent-replay = { path = "../tantra-agent/crates/tantra-agent-replay" }
tantra-agent-llm = { path = "../tantra-agent/crates/tantra-agent-llm" }
tantra-agent-trader-loop = { path = "../tantra-agent/crates/tantra-agent-trader-loop" }
tantra-agent-research = { path = "../tantra-agent/crates/tantra-agent-research" }
tantra-agent-analytics = { path = "../tantra-agent/crates/tantra-agent-analytics" }
tantra-agent-genetic = { path = "../tantra-agent/crates/tantra-agent-genetic" }
tantra-agent-mcp = { path = "../tantra-agent/crates/tantra-agent-mcp" }
tantra-ffi-codegen = { path = "../tantra-ffi/crates/tantra-ffi-codegen" }
tantra-ffi-py = { path = "../tantra-ffi/crates/tantra-ffi-py" }

# External dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
rust_decimal = "1"
rust_decimal_macros = "1"
prometheus = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-util = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "rust_decimal", "macros", "migrate"] }
arrow = "53"
parquet = "53"
anyhow = "1"
bytes = "1"
rand = "0.8"
schemars = "0.8"
cron = "0.17"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }
async-stream = "0.3"
tokio-stream = "0.1"
http-body-util = "0.1"
serde_urlencoded = "0.7"
jsonwebtoken = { version = "9.3", default-features = false, features = ["use_pem"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
getrandom = "0.3"
toml = "0.8"
hex = "0.4"
sha2 = "0.10"
tempfile = "3"
rand_distr = "0.4"
num_cpus = "1"
rayon = "1.9"
statrs = "0.16"
tokio-tungstenite = "0.24"
reqwest = "0.12"

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
